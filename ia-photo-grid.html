<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Photos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Roboto', sans-serif;
    background: transparent;
    overflow-x: hidden;
  }

  .ia-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .ia-item {
    cursor: pointer;
    text-decoration: none;
    color: #000;
  }

  .ia-photo {
    width: 100%;
    height: 200px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #BFDCF2;
    background: #DEEAF8;
    position: relative;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }

  .ia-item:hover .ia-photo {
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  }

  .ia-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ia-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .ia-caption {
    margin-top: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    color: #36454F;
    text-align: center;
    line-height: 1.25;
  }

  /* Lightbox */
  .lb {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .lb.open { display: flex; }

  .lb-close {
    position: absolute;
    top: 18px;
    right: 18px;
    background: none;
    border: none;
    color: #fff;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.75;
    transition: opacity 0.2s;
    z-index: 2;
  }
  .lb-close:hover { opacity: 1; }

  .lb-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    flex: 1;
    padding: 48px 72px 24px;
    min-height: 0;
  }

  .lb-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }

  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-size: 28px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.25); }
  .lb-prev { left: 16px; }
  .lb-next { right: 16px; }

  .lb-caption {
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    padding: 0 24px 16px;
  }

  .lb-thumbs {
    display: flex;
    gap: 8px;
    padding: 12px 24px 20px;
    overflow-x: auto;
    justify-content: center;
    flex-shrink: 0;
  }

  .lb-thumb {
    width: 72px;
    height: 52px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid transparent;
    opacity: 0.55;
    transition: opacity 0.2s, border-color 0.2s;
  }
  .lb-thumb.active { border-color: #009EDB; opacity: 1; }
  .lb-thumb:hover { opacity: 0.85; }
  .lb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (max-width: 700px) {
    .ia-grid { grid-template-columns: repeat(2, 1fr); }
    .ia-photo { height: 150px; }
    .lb-stage { padding: 48px 52px 16px; }
    .lb-nav { width: 36px; height: 36px; font-size: 20px; }
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }
  }
</style>
</head>
<body>

<div class="ia-grid" id="iaGrid">

  <div class="ia-item" data-index="0">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6a7d6eb429fb231c2ee_minusca%20IA.jpeg" alt="MINUSCA IA 2026">
    </div>
    <div class="ia-caption">MINUSCA IA, 2026</div>
  </div>

  <div class="ia-item" data-index="1">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a1fdbd70c02a51fa50d6b4d_MINUSCA%20IA%20Photo.jpg" alt="MINUSCA IA 2025">
    </div>
    <div class="ia-caption">MINUSCA IA, 2025</div>
  </div>

  <div class="ia-item" data-index="2">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6b94d2546373fa7d01f_unmiss%20IA.jpg" alt="UNMISS IA 2025">
      <span class="ia-badge">2 photos</span>
    </div>
    <div class="ia-caption">UNMISS IA, 2025</div>
  </div>

  <div class="ia-item" data-index="3">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e7376c044b7685881d22_UNIFICYP%20IA.jpeg" alt="UNFICYP IA 2025">
    </div>
    <div class="ia-caption">UNFICYP IA, 2025</div>
  </div>

</div>

<div class="lb" id="lb">
  <button class="lb-close" id="lbClose">&#215;</button>
  <div class="lb-stage">
    <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
    <img class="lb-img" id="lbImg" src="" alt="">
    <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
  </div>
  <div class="lb-caption" id="lbCaption"></div>
  <div class="lb-thumbs" id="lbThumbs"></div>
</div>

<script>
  const photos = [
    { src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6a7d6eb429fb231c2ee_minusca%20IA.jpeg", caption: "MINUSCA IA, 2026" },
    { src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a1fdbd70c02a51fa50d6b4d_MINUSCA%20IA%20Photo.jpg", caption: "MINUSCA IA, 2025" },
    { src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6b94d2546373fa7d01f_unmiss%20IA.jpg", caption: "UNMISS IA, 2025" },
    { src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e7376c044b7685881d22_UNIFICYP%20IA.jpeg", caption: "UNFICYP IA, 2025" }
  ];

  let current = 0;
  const lb       = document.getElementById('lb');
  const lbImg    = document.getElementById('lbImg');
  const lbCap    = document.getElementById('lbCaption');
  const lbThumbs = document.getElementById('lbThumbs');

  // Build thumbnails
  photos.forEach(function(p, i) {
    const t = document.createElement('div');
    t.className = 'lb-thumb';
    t.dataset.index = i;
    t.innerHTML = '<img src="' + p.src + '" alt="' + p.caption + '">';
    t.addEventListener('click', function() { goTo(i); });
    lbThumbs.appendChild(t);
  });

  function updateThumbs() {
    lbThumbs.querySelectorAll('.lb-thumb').forEach(function(t, i) {
      t.classList.toggle('active', i === current);
    });
  }

  function goTo(index) {
    current = (index + photos.length) % photos.length;
    lbImg.src = photos[current].src;
    lbImg.alt = photos[current].caption;
    lbCap.textContent = photos[current].caption;
    updateThumbs();
  }

  function openLb(index) {
    goTo(index);
    lb.classList.add('open');
    window.parent.postMessage({ type: 'ia-lb-open' }, '*');
  }

  function closeLb() {
    lb.classList.remove('open');
    lbImg.src = '';
    window.parent.postMessage({ type: 'ia-lb-close' }, '*');
  }

  document.getElementById('iaGrid').addEventListener('click', function(e) {
    const item = e.target.closest('.ia-item');
    if (item) openLb(parseInt(item.dataset.index));
  });

  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', function() { goTo(current - 1); });
  document.getElementById('lbNext').addEventListener('click', function() { goTo(current + 1); });

  lb.addEventListener('click', function(e) { if (e.target === lb) closeLb(); });

  document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft')  goTo(current - 1);
    if (e.key === 'Escape')     closeLb();
  });
</script>

</body>
</html>
