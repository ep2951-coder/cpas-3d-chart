<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Photos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Roboto', sans-serif;
    background: transparent;
    padding: 0;
    overflow-x: hidden;
  }

  .ia-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .ia-item {
    cursor: pointer;
    text-decoration: none;
    color: #000;
  }

  .ia-photo {
    width: 100%;
    height: 200px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #BFDCF2;
    background: #DEEAF8;
    position: relative;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }

  .ia-item:hover .ia-photo {
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  }

  .ia-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ia-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    font-family: 'Roboto', sans-serif;
  }

  .ia-caption {
    margin-top: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    color: #36454F;
    text-align: center;
    line-height: 1.25;
    font-family: 'Roboto', sans-serif;
  }

  .lb-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .lb-overlay.open { display: flex; }

  .lb-inner {
    position: relative;
    max-width: min(90vw, 960px);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .lb-img {
    max-width: 100%;
    max-height: 78vh;
    border-radius: 10px;
    object-fit: contain;
    display: block;
  }

  .lb-caption {
    color: #ffffff;
    font-family: 'Roboto', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
  }

  .lb-close {
    position: absolute;
    top: -16px;
    right: -16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .lb-close:hover { background: rgba(255,255,255,0.3); }

  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.3); }
  .lb-prev { left: -56px; }
  .lb-next { right: -56px; }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .ia-grid { grid-template-columns: repeat(2, 1fr); }
    .ia-photo { height: 150px; }
    .lb-prev { left: -44px; }
    .lb-next { right: -44px; }
  }

  @media (max-width: 400px) {
    .ia-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .ia-photo { height: 130px; }
  }
</style>
</head>
<body>

<!-- Photo grid -->
<div class="ia-grid" id="iaGrid">

  <div class="ia-item" data-index="0">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6a7d6eb429fb231c2ee_minusca%20IA.jpeg" alt="MINUSCA IA 2026">
    </div>
    <div class="ia-caption">MINUSCA IA, 2026</div>
  </div>

  <div class="ia-item" data-index="1">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a1fdbd70c02a51fa50d6b4d_MINUSCA%20IA%20Photo.jpg" alt="MINUSCA IA 2025">
    </div>
    <div class="ia-caption">MINUSCA IA, 2025</div>
  </div>

  <div class="ia-item" data-index="2">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6b94d2546373fa7d01f_unmiss%20IA.jpg" alt="UNMISS IA 2025">
      <span class="ia-badge">2 photos</span>
    </div>
    <div class="ia-caption">UNMISS IA, 2025</div>
  </div>

  <div class="ia-item" data-index="3">
    <div class="ia-photo">
      <img src="https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e7376c044b7685881d22_UNIFICYP%20IA.jpeg" alt="UNFICYP IA 2025">
    </div>
    <div class="ia-caption">UNFICYP IA, 2025</div>
  </div>

</div>

<div class="lb-overlay" id="lbOverlay">
  <div class="lb-inner">
    <button class="lb-close" id="lbClose">&#215;</button>
    <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
    <img class="lb-img" id="lbImg" src="" alt="">
    <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
    <div class="lb-caption" id="lbCaption"></div>
  </div>
</div>

<script>
  const photos = [
    {
      src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6a7d6eb429fb231c2ee_minusca%20IA.jpeg",
      caption: "MINUSCA IA, 2026"
    },
    {
      src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a1fdbd70c02a51fa50d6b4d_MINUSCA%20IA%20Photo.jpg",
      caption: "MINUSCA IA, 2025"
    },
    {
      src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e6b94d2546373fa7d01f_unmiss%20IA.jpg",
      caption: "UNMISS IA, 2025"
    },
    {
      src: "https://cdn.prod.website-files.com/664e62120079c3997fff84d4/6a02e7376c044b7685881d22_UNIFICYP%20IA.jpeg",
      caption: "UNFICYP IA, 2025"
    }
  ];

  let current = 0;

  const overlay = document.getElementById('lbOverlay');
  const lbImg   = document.getElementById('lbImg');
  const lbCap   = document.getElementById('lbCaption');

  function open(index) {
    current = index;
    lbImg.src = photos[current].src;
    lbImg.alt = photos[current].caption;
    lbCap.textContent = photos[current].caption;
    overlay.classList.add('open');
  }

  function close() {
    overlay.classList.remove('open');
    lbImg.src = '';
  }

  function navigate(dir) {
    current = (current + dir + photos.length) % photos.length;
    lbImg.src = photos[current].src;
    lbImg.alt = photos[current].caption;
    lbCap.textContent = photos[current].caption;
  }

  document.getElementById('iaGrid').addEventListener('click', function(e) {
    const item = e.target.closest('.ia-item');
    if (item) open(parseInt(item.dataset.index));
  });

  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function() { navigate(-1); });
  document.getElementById('lbNext').addEventListener('click', function() { navigate(1); });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) close();
  });

  document.addEventListener('keydown', function(e) {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'Escape')     close();
  });
</script>

</body>
</html>
