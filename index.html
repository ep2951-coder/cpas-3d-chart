<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UN Mission Data Collection Growth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --adjust:     #013363;
    --plan:       #25e6d5;
    --implement:  #8ab6e9;
    --assess:     #1b9ad2;
    --border:     #B9DDF1;
    --light-grey: #B3B3B3;
    --text-dark:  #333333;
  }

  body {
    font-family: 'Roboto', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.25rem;
    background: transparent;
    padding: 0;
  }

  /* ── Outer card ── */
  .chart-card {
    background: var(--adjust);
    border-radius: 0;
    padding: 28px 24px 20px;
    margin-bottom: 0;
  }

  /* ── Arrow row (sits ABOVE the chart, never overlaps) ── */
  .arrow-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .arrow-btn {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(185,221,241,0.30);
    color: rgba(255,255,255,0.85);
    border-radius: 6px;
    cursor: pointer;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-family: 'Roboto', sans-serif;
    transition: background 0.2s;
    user-select: none;
    flex-shrink: 0;
  }
  .arrow-btn:hover  { background: rgba(255,255,255,0.20); }
  .arrow-btn:active { background: rgba(255,255,255,0.28); }
  .arrow-btn:disabled { opacity: 0.28; cursor: default; }

  /* ── Chart layout: pinned Y-axis + scrollable bars ── */
  .chart-shell {
    display: flex;
    align-items: stretch;
  }

  /* Pinned Y-axis column */
  .yaxis-col {
    flex-shrink: 0;
    width: 72px;
    position: relative;
  }
  .yaxis-col canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  /* Scrollable bar area */
  .scroll-area-wrapper {
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .scroll-area {
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;        /* Firefox */
    -ms-overflow-style: none;     /* IE/Edge */
  }
  .scroll-area::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  /* ── Tooltip ── */
  .chart-tooltip {
    position: fixed;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 9999;
    min-width: 210px;
    max-width: 260px;
    box-shadow: 0 8px 24px rgba(1,51,99,0.12);
  }
  .chart-tooltip.visible { opacity: 1; }

  .tt-label {
    font-size: 1rem; font-weight: 400; line-height: 1.25rem;
    color: var(--light-grey); margin-bottom: 2px;
  }
  .tt-val {
    font-size: 1rem; font-weight: 700; line-height: 1.25rem;
    color: var(--adjust); margin-bottom: 10px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .tt-total-label {
    font-size: 1rem; font-weight: 400; line-height: 1.25rem;
    color: var(--light-grey); margin-bottom: 2px;
  }
  .tt-total-val {
    font-size: 1rem; font-weight: 700; line-height: 1.25rem;
    color: var(--assess); margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .tt-missions { display: flex; flex-direction: column; gap: 6px; }
  .tt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tt-left { display: flex; align-items: center; gap: 8px; }
  .tt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tt-name  { font-size: 1rem; font-weight: 400; line-height: 1.25rem; color: var(--text-dark); }
  .tt-count { font-size: 1rem; font-weight: 700; line-height: 1.25rem; color: var(--adjust); }

  /* ── Legend card ── */
  .legend-card {
    background: var(--adjust);
    border-radius: 0;
    padding: 22px 24px;
    border-top: 1px solid rgba(185,221,241,0.15);
  }

  .legend-header {
    display: flex; align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px; flex-wrap: wrap; gap: 6px;
  }
  .legend-title {
    font-size: 1rem; font-weight: 700; line-height: 1.25rem; color: #ffffff;
  }

  .legend-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  @media (max-width: 900px) { .legend-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 600px) {
    .chart-card  { padding: 16px 12px 12px; }
    .legend-card { padding: 16px 12px; }
    .legend-grid { grid-template-columns: repeat(2, 1fr); }
    .legend-item { padding: 5px 8px; }
    .legend-name { font-size: 0.78rem; }
  }

  .legend-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(185,221,241,0.25);
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, opacity 0.2s, transform 0.15s;
    user-select: none; justify-content: flex-start;
  }
  .legend-item:hover  { background: rgba(255,255,255,0.11); transform: translateY(-1px); }
  .legend-item.active { background: rgba(185,221,241,0.15); border-color: var(--border); }
  .legend-item.faded  { opacity: 0.25; }
  .legend-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-name {
    font-size: 1rem; font-weight: 400; line-height: 1.25rem;
    color: rgba(255,255,255,0.65);
  }
  .legend-item.active .legend-name { color: #ffffff; }
</style>
</head>
<body>

<!-- Chart card -->
<div class="chart-card">
  <!-- Scroll arrows (above the chart, never overlapping) -->
  <div class="arrow-row">
    <button class="arrow-btn" id="btnLeft"  aria-label="Scroll left">&#8592;</button>
    <button class="arrow-btn" id="btnRight" aria-label="Scroll right">&#8594;</button>
  </div>

  <!-- Pinned Y-axis + scrollable bars side by side -->
  <div class="chart-shell">
    <div class="yaxis-col" id="yaxisCol">
      <canvas id="yaxisCanvas"></canvas>
    </div>
    <div class="scroll-area-wrapper">
      <div class="scroll-area" id="scrollArea">
        <canvas id="missionChart"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Legend -->
<div class="legend-card">
  <div class="legend-header">
    <div class="legend-title">Click any mission to highlight</div>
  </div>
  <div class="legend-grid" id="legendGrid"></div>
</div>

<!-- Tooltip -->
<div class="chart-tooltip" id="tooltip"></div>

<script>
/* ── Data ── */
const missions = [
  { key: 'MINUSCA', color: '#009EDB' },
  { key: 'MONUSCO', color: '#DAA520' },
  { key: 'UNFICYP', color: '#8ab6e9' },
  { key: 'UNMISS',  color: '#25e6d5' },
  { key: 'UNIFIL',  color: '#509E3E' },
  { key: 'UNMIK',   color: '#A01D43' },
  { key: 'UNMOGIP', color: '#bfbfbf' },
  { key: 'UNTSO',   color: '#AA5000' },
  { key: 'UNISFA',  color: '#FD3C2D' },
  { key: 'MINURSO', color: '#B1E0A4' },
  { key: 'UNDOF',   color: '#FF7F50' },
  { key: 'MINUSMA', color: '#FFFFFF' },
];

const chartData = [
  { quarter:'Q4 2019', UNFICYP:337,  UNIFIL:22,   UNMISS:12,   MINUSCA:158,   MONUSCO:0,     MINUSMA:0, UNMIK:0,    MINURSO:0,  UNMOGIP:0,    UNTSO:0,    UNISFA:0,  UNDOF:0    },
  { quarter:'Q1 2020', UNFICYP:515,  UNIFIL:45,   UNMISS:108,  MINUSCA:416,   MONUSCO:0,     MINUSMA:0, UNMIK:0,    MINURSO:0,  UNMOGIP:0,    UNTSO:0,    UNISFA:0,  UNDOF:0    },
  { quarter:'Q2 2020', UNFICYP:658,  UNIFIL:45,   UNMISS:108,  MINUSCA:1053,  MONUSCO:0,     MINUSMA:0, UNMIK:0,    MINURSO:0,  UNMOGIP:0,    UNTSO:0,    UNISFA:0,  UNDOF:0    },
  { quarter:'Q3 2020', UNFICYP:757,  UNIFIL:46,   UNMISS:108,  MINUSCA:1231,  MONUSCO:6,     MINUSMA:0, UNMIK:0,    MINURSO:0,  UNMOGIP:0,    UNTSO:0,    UNISFA:0,  UNDOF:0    },
  { quarter:'Q4 2020', UNFICYP:1651, UNIFIL:275,  UNMISS:108,  MINUSCA:1462,  MONUSCO:6,     MINUSMA:0, UNMIK:85,   MINURSO:0,  UNMOGIP:0,    UNTSO:0,    UNISFA:0,  UNDOF:0    },
  { quarter:'Q1 2021', UNFICYP:2111, UNIFIL:396,  UNMISS:108,  MINUSCA:1788,  MONUSCO:6,     MINUSMA:0, UNMIK:85,   MINURSO:72, UNMOGIP:0,    UNTSO:0,    UNISFA:0,  UNDOF:0    },
  { quarter:'Q2 2021', UNFICYP:2592, UNIFIL:555,  UNMISS:108,  MINUSCA:1964,  MONUSCO:6,     MINUSMA:0, UNMIK:134,  MINURSO:72, UNMOGIP:606,  UNTSO:0,    UNISFA:0,  UNDOF:8    },
  { quarter:'Q3 2021', UNFICYP:2984, UNIFIL:686,  UNMISS:225,  MINUSCA:2292,  MONUSCO:26,    MINUSMA:0, UNMIK:134,  MINURSO:134,UNMOGIP:674,  UNTSO:0,    UNISFA:0,  UNDOF:8    },
  { quarter:'Q4 2021', UNFICYP:3372, UNIFIL:753,  UNMISS:567,  MINUSCA:2555,  MONUSCO:32,    MINUSMA:0, UNMIK:134,  MINURSO:165,UNMOGIP:737,  UNTSO:50,   UNISFA:2,  UNDOF:316  },
  { quarter:'Q1 2022', UNFICYP:3797, UNIFIL:904,  UNMISS:605,  MINUSCA:3023,  MONUSCO:829,   MINUSMA:0, UNMIK:824,  MINURSO:218,UNMOGIP:973,  UNTSO:881,  UNISFA:740,UNDOF:381  },
  { quarter:'Q2 2022', UNFICYP:4097, UNIFIL:1237, UNMISS:847,  MINUSCA:3964,  MONUSCO:1858,  MINUSMA:0, UNMIK:1202, MINURSO:275,UNMOGIP:973,  UNTSO:1470, UNISFA:754,UNDOF:435  },
  { quarter:'Q3 2022', UNFICYP:4438, UNIFIL:1237, UNMISS:874,  MINUSCA:5502,  MONUSCO:2356,  MINUSMA:0, UNMIK:1307, MINURSO:292,UNMOGIP:1147, UNTSO:1568, UNISFA:785,UNDOF:538  },
  { quarter:'Q4 2022', UNFICYP:4719, UNIFIL:1291, UNMISS:922,  MINUSCA:9651,  MONUSCO:3030,  MINUSMA:0, UNMIK:1694, MINURSO:353,UNMOGIP:1233, UNTSO:1682, UNISFA:805,UNDOF:616  },
  { quarter:'Q1 2023', UNFICYP:5096, UNIFIL:1331, UNMISS:938,  MINUSCA:13117, MONUSCO:3439,  MINUSMA:0, UNMIK:1709, MINURSO:364,UNMOGIP:1233, UNTSO:2174, UNISFA:817,UNDOF:734  },
  { quarter:'Q2 2023', UNFICYP:5370, UNIFIL:1370, UNMISS:1640, MINUSCA:15668, MONUSCO:4550,  MINUSMA:0, UNMIK:2198, MINURSO:384,UNMOGIP:1371, UNTSO:2316, UNISFA:832,UNDOF:1052 },
  { quarter:'Q3 2023', UNFICYP:5734, UNIFIL:1405, UNMISS:2965, MINUSCA:17711, MONUSCO:6657,  MINUSMA:0, UNMIK:2198, MINURSO:401,UNMOGIP:1435, UNTSO:2519, UNISFA:842,UNDOF:1227 },
  { quarter:'Q4 2023', UNFICYP:6063, UNIFIL:1445, UNMISS:3145, MINUSCA:21270, MONUSCO:8847,  MINUSMA:0, UNMIK:2198, MINURSO:401,UNMOGIP:2261, UNTSO:2567, UNISFA:869,UNDOF:1317 },
  { quarter:'Q1 2024', UNFICYP:6353, UNIFIL:1469, UNMISS:3317, MINUSCA:32717, MONUSCO:9672,  MINUSMA:0, UNMIK:2198, MINURSO:469,UNMOGIP:2456, UNTSO:2900, UNISFA:876,UNDOF:1678 },
  { quarter:'Q2 2024', UNFICYP:6606, UNIFIL:1513, UNMISS:5268, MINUSCA:39414, MONUSCO:10225, MINUSMA:0, UNMIK:2198, MINURSO:469,UNMOGIP:2844, UNTSO:3014, UNISFA:876,UNDOF:1841 },
  { quarter:'Q3 2024', UNFICYP:6834, UNIFIL:1546, UNMISS:5626, MINUSCA:47863, MONUSCO:10741, MINUSMA:0, UNMIK:2198, MINURSO:490,UNMOGIP:2925, UNTSO:3122, UNISFA:876,UNDOF:2050 },
  { quarter:'Q4 2024', UNFICYP:7029, UNIFIL:1572, UNMISS:6308, MINUSCA:54608, MONUSCO:11498, MINUSMA:0, UNMIK:2198, MINURSO:510,UNMOGIP:2968, UNTSO:3170, UNISFA:876,UNDOF:2192 },
  { quarter:'Q1 2025', UNFICYP:7175, UNIFIL:1652, UNMISS:6796, MINUSCA:59419, MONUSCO:11002, MINUSMA:0, UNMIK:2198, MINURSO:553,UNMOGIP:3088, UNTSO:3261, UNISFA:876,UNDOF:2313 },
];

// ═══════════════════════════════════════════════
// API CONFIGURATION
// To connect live data, set USE_API to true and
// fill in your endpoint and key below.
// ═══════════════════════════════════════════════
const USE_API = false;
const API_URL = 'https://YOUR_CPAS_API_ENDPOINT_HERE'; // ← replace with CPAS API URL
const API_KEY = 'YOUR_API_KEY_HERE';                   // ← replace with CPAS API key
// Expected API response format:
// [{ quarter: 'Q1 2020', MINUSCA: 416, MONUSCO: 0, ... }, ...]
// ═══════════════════════════════════════════════

/* ── Config ── */
const BAR_W   = 38;    // px per bar column
const CHART_H = 460;   // match original height
const labels  = chartData.map(d => d.quarter);
let selectedMissions = [];

/* ── Dataset builder ── */
function buildDatasets() {
  return missions.map(m => ({
    label: m.key,
    data: chartData.map(d => d[m.key]),
    backgroundColor: selectedMissions.length === 0 || selectedMissions.includes(m.key)
      ? m.color : m.color + '28',
    borderColor: 'transparent',
    borderWidth: 0,
    stack: 'missions',
    _color: m.color,
    _key: m.key,
  }));
}

/* ── 3-D plugin ── */
function lighten(hex, p) {
  const [r,g,b] = hexRgb(hex);
  return `rgb(${Math.min(255,r+p*2)},${Math.min(255,g+p*2)},${Math.min(255,b+p*2)})`;
}
function darken(hex, p) {
  const [r,g,b] = hexRgb(hex);
  return `rgb(${Math.max(0,r-p*2)},${Math.max(0,g-p*2)},${Math.max(0,b-p*2)})`;
}
function hexRgb(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

const threeDPlugin = {
  id: 'threeD',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const depth = 5;
    chart.data.datasets.forEach((dataset, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      meta.data.forEach((bar) => {
        const { x, y, width, height, base } = bar.getProps(['x','y','width','height','base'], true);
        if (!height || height <= 0) return;
        const color  = dataset._color;
        const isFaded = selectedMissions.length > 0 && !selectedMissions.includes(dataset._key);
        ctx.save();
        ctx.globalAlpha = isFaded ? 0.08 : 1;
        const left = x - width / 2, right = x + width / 2;
        /* top face */
        ctx.beginPath();
        ctx.moveTo(left, y); ctx.lineTo(left+depth, y-depth);
        ctx.lineTo(right+depth, y-depth); ctx.lineTo(right, y);
        ctx.closePath();
        ctx.fillStyle = lighten(color, 35); ctx.fill();
        /* right face */
        ctx.beginPath();
        ctx.moveTo(right, y); ctx.lineTo(right+depth, y-depth);
        ctx.lineTo(right+depth, base-depth); ctx.lineTo(right, base);
        ctx.closePath();
        ctx.fillStyle = darken(color, 30); ctx.fill();
        ctx.restore();
      });
    });
  }
};

Chart.register(threeDPlugin);

/* ── Size the scrollable canvas ── */
const totalCols = labels.length;
const canvasW   = totalCols * (BAR_W + 18) + 48;

const mainCanvas = document.getElementById('missionChart');
mainCanvas.width        = canvasW;
mainCanvas.style.width  = canvasW + 'px';
mainCanvas.style.height = CHART_H + 'px';
mainCanvas.height       = CHART_H;

/* ── Main chart (Y-axis hidden — drawn separately) ── */
const chart = new Chart(mainCanvas.getContext('2d'), {
  type: 'bar',
  data: { labels, datasets: buildDatasets() },
  options: {
    responsive: false,
    maintainAspectRatio: false,
    animation: { duration: 350 },
    layout: { padding: { left: 0, right: 16 } },
    plugins: {
      legend:  { display: false },
      tooltip: { enabled: false },
    },
    scales: {
      x: {
        stacked: true,
        ticks: {
          color: 'rgba(255,255,255,0.55)',
          font: { family: 'Roboto', size: 13, weight: '400' },
          maxRotation: 45,
          minRotation: 45,
        },
        grid:   { color: 'transparent' },
        border: { color: 'rgba(185,221,241,0.2)' },
      },
      y: {
        stacked: true,
        display: false,   /* hidden — mirrored on yaxisCanvas */
        min: 0,
        max: 100000,
        ticks: {
          color: 'rgba(255,255,255,0.55)',
          font: { family: 'Roboto', size: 13, weight: '400' },
          stepSize: 10000,
          callback: v => v >= 1000 ? (v/1000).toFixed(0)+'K' : '0',
        },
        grid:   { color: 'rgba(185,221,241,0.08)' },
        border: { color: 'transparent' },
      },
    },
  },
});

/* ── Pinned Y-axis chart ── */
const yCanvas  = document.getElementById('yaxisCanvas');
let   yChart   = null;

function syncYAxis() {
  const chartArea = chart.chartArea;
  if (!chartArea) return;

  const h = CHART_H;
  const yCol = document.getElementById('yaxisCol');
  yCol.style.height  = h + 'px';
  yCanvas.style.height = h + 'px';
  yCanvas.height       = h;
  yCanvas.width        = 72;

  if (yChart) { yChart.destroy(); yChart = null; }

  yChart = new Chart(yCanvas.getContext('2d'), {
    type: 'bar',
    data: { labels: [''], datasets: [{ data: [0], stack: 'y' }] },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      animation: false,
      layout: { padding: { top: chart.chartArea.top, bottom: h - chart.chartArea.bottom } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: { display: false, stacked: true },
        y: {
          stacked: true,
          display: true,
          min: 0,
          max: 100000,
          ticks: {
            color: 'rgba(255,255,255,0.55)',
            font: { family: 'Roboto', size: 14, weight: '400' },
            stepSize: 10000,
            callback: v => v >= 1000 ? (v/1000).toFixed(0)+'K' : '0',
          },
          grid:   { color: 'rgba(185,221,241,0.08)', drawTicks: false },
          border: { color: 'transparent' },
        },
      },
    },
  });
}

/* First render: draw synchronously then build Y-axis */
chart.options.animation = { duration: 0 };
requestAnimationFrame(() => {
  chart.update();
  syncYAxis();
  chart.options.animation = { duration: 350 };
});

/* ── Scroll arrows ── */
const scrollArea  = document.getElementById('scrollArea');
const SCROLL_STEP = (BAR_W + 18) * 4;

function updateArrows() {
  const sl       = scrollArea.scrollLeft;
  const maxScroll = scrollArea.scrollWidth - scrollArea.clientWidth;
  document.getElementById('btnLeft').disabled  = sl <= 0;
  document.getElementById('btnRight').disabled = sl >= maxScroll - 1;
}

document.getElementById('btnLeft').addEventListener('click', () => {
  scrollArea.scrollBy({ left: -SCROLL_STEP, behavior: 'smooth' });
});
document.getElementById('btnRight').addEventListener('click', () => {
  scrollArea.scrollBy({ left: SCROLL_STEP, behavior: 'smooth' });
});

scrollArea.addEventListener('scroll', updateArrows);
setTimeout(updateArrows, 120);

/* ── Tooltip — side decided once on mouseenter, frozen until mouseleave ── */
const tooltip   = document.getElementById('tooltip');
const TT_W      = 278;
const TT_OFFSET = 18;
let lastIdx     = -1;
let tooltipSide = null; // set ONCE on mouseenter, never touched again until mouseleave

mainCanvas.addEventListener('mouseenter', (e) => {
  // Lock the side the very moment the cursor enters the canvas
  tooltipSide = (e.clientX + TT_OFFSET + TT_W) <= (window.innerWidth - 8) ? 'right' : 'left';
});

mainCanvas.addEventListener('mousemove', (e) => {
  const pts = chart.getElementsAtEventForMode(e, 'index', { intersect: false }, true);
  if (!pts.length) {
    tooltip.classList.remove('visible');
    lastIdx = -1;
    return;
  }

  const idx = pts[0].index;

  if (idx !== lastIdx) {
    const row    = chartData[idx];
    const active = missions.filter(m => row[m.key] > 0);
    const total  = active.reduce((s, m) => s + row[m.key], 0);
    tooltip.innerHTML = `
      <div class="tt-label">Quarter</div>
      <div class="tt-val">${row.quarter}</div>
      <div class="tt-total-label">Total data points</div>
      <div class="tt-total-val">${total.toLocaleString()}</div>
      <div class="tt-missions">
        ${active.map(m => `
          <div class="tt-row">
            <div class="tt-left">
              <span class="tt-dot" style="background:${m.color}"></span>
              <span class="tt-name">${m.key}</span>
            </div>
            <span class="tt-count">${row[m.key].toLocaleString()}</span>
          </div>`).join('')}
      </div>`;
    lastIdx = idx;
  }

  // Position uses the frozen side — no recalculation, no flipping
  const tx = tooltipSide === 'right' ? e.clientX + TT_OFFSET : e.clientX - TT_W - TT_OFFSET;
  const TH = 400;
  const vh = window.innerHeight;
  let ty = e.clientY - 20;
  if (ty + TH > vh - 8) ty = vh - TH - 8;
  if (ty < 8)           ty = 8;

  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
  tooltip.classList.add('visible');
});

mainCanvas.addEventListener('mouseleave', () => {
  tooltip.classList.remove('visible');
  lastIdx = -1;
  tooltipSide = null;
});

/* ── Legend ── */
const grid = document.getElementById('legendGrid');
missions.forEach(m => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-dot" style="background:${m.color}"></span><span class="legend-name">${m.key}</span>`;
  item.addEventListener('click', () => {
    if (selectedMissions.includes(m.key)) {
      selectedMissions = selectedMissions.filter(k => k !== m.key);
      item.classList.remove('active');
    } else {
      selectedMissions.push(m.key);
      item.classList.add('active');
    }
    grid.querySelectorAll('.legend-item').forEach((el, i) => {
      el.classList.toggle('faded', selectedMissions.length > 0 && !selectedMissions.includes(missions[i].key));
    });
    chart.data.datasets = buildDatasets();
    chart.update('active');
  });
  grid.appendChild(item);
});
</script>
</body>
</html>
